<h1>Goku</h1>
<dl>
  <td>Nombre:</td>
  <dd> {{nombre}} </dd>

  <td>Edad:</td>
  <dd> {{edad}} </dd>

  <td>Método:</td>
  <dd> {{getDescripcionHeroe()}} </dd>

  <td>Capitalizado:</td>
  <dd> {{nombreCapitalizado}} </dd>
</dl>

<button *ngIf="nombre === 'Goku'" (click)="cambiarNombre()" class="btn btn-primary mx-2">
  Cambiar nombre
</button>

<button *ngIf="edad === 35" (click)="cambiarEdad()" class="btn btn-primary">
  Cambiar edad
</button>
